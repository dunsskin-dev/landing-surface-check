name: Update FAA data and publish

on:
  push:
    branches: [main]
  schedule:
    # Every Thursday at 14:17 UTC. FAA 28-day cycles take effect on Thursdays at 09:01 UTC.
    - cron: "17 14 * * 4"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Check for new FAA data
        id: update
        if: github.event_name != 'push'
        run: |
          set +e
          python3 -I tools/update_data.py | tee update.log
          code=${PIPESTATUS[0]}
          set -e
          status=$(tail -n 1 update.log)
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$code" = "2" ]; then
            echo "::warning::FAA data wasn't available this run ($status). The site keeps the previous data; next week's run tries again."
          elif [ "$code" != "0" ]; then
            echo "::error::FAA data update failed ($status). The site keeps the previous data."
            exit 1
          fi

      - name: Save the new data to the repository
        if: startsWith(steps.update.outputs.status, 'UPDATED')
        env:
          STATUS: ${{ steps.update.outputs.status }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add facilities.json
          git commit -m "FAA data: $STATUS"
          git push

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html facilities.json _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
